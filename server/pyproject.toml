[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deptagent-server"
version = "0.1.0"
description = "部门智通控制平面（FastAPI + SQLite）——约定与口径见 docs/SPEC.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "argon2-cffi>=23.1", # SPEC 10.1：密码哈希 Argon2id（决策点 D11 倾向值）
    "pyjwt>=2.8",        # SPEC 10.1：JWT HS256
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=2.16", # FastAPI TestClient 依赖（starlette 新版指定 httpx2）
    "ruff>=0.4",
]

[project.scripts]
deptagent = "deptagent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
